[workspace]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-game-engine"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
library-build = "bash scripts/build.sh"
library-test = { cmd = "bash scripts/test.sh", depends-on = ["library-build"] }
library-smoke = { cmd = "env SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy bash scripts/smoke.sh", depends-on = ["library-build"] }
library-demo = { cmd = "build/orb-collector", depends-on = ["library-build"] }
world-demo = { cmd = "bash scripts/run-vulkan.sh build/open-world", depends-on = ["library-build"] }
world-smoke = { cmd = "env MOJO_VK_SOFTWARE=1 bash scripts/run-vulkan.sh build/open-world --smoke", depends-on = ["library-build"] }
vulkan-test = { cmd = "env MOJO_VK_VALIDATION=1 VK_LAYER_VALIDATE_SYNC=1 bash scripts/test.sh", depends-on = ["library-build"] }
vulkan-window-test = { cmd = "bash scripts/test-vulkan-window.sh", depends-on = ["library-build"] }
frankie-build = { cmd = "bash scripts/build-frankie.sh", depends-on = ["library-build"] }
frankie = { cmd = "bash scripts/run-vulkan.sh build/yo-frankie", depends-on = ["frankie-build"] }
frankie-test = { cmd = "bash scripts/test-frankie.sh", depends-on = ["frankie-build"] }
frankie-window-test = { cmd = "bash scripts/test-vulkan-window.sh --frankie", depends-on = ["frankie-build"] }
play = { depends-on = ["frankie-polished"] }
frankie-polished = { cmd = "bash scripts/run-vulkan.sh build/yo-frankie --polished", depends-on = ["frankie-build"] }
frankie-remake-assets = "bash scripts/remake-frankie.sh"
frankie-benchmark = { cmd = "python3 scripts/benchmark-frankie.py", depends-on = ["frankie-build"] }
frankie-realistic = { cmd = "bash scripts/run-vulkan.sh build/yo-frankie --realistic", depends-on = ["frankie-build"] }
frankie-realistic-test = { cmd = "bash scripts/test-frankie-realistic.sh", depends-on = ["frankie-build"] }

[dependencies]
mojo = ">=1.2.0.dev2026092905,<2"
